name: Release

# A tag push such as 1.0.0 tests, packages and attests the extension in a draft release. After
# approval in the `marketplace` environment, it publishes to the stores through trusted publishing.
on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: xvfb-run -a npm run test:integration
      - run: npm run package
      - uses: actions/attest@v4
        with:
          subject-path: carbonwire-${{ github.ref_name }}.vsix
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes "carbonwire-$GITHUB_REF_NAME.vsix"

  publish:
    needs: release
    runs-on: ubuntu-latest
    # Waits for a required reviewer to approve; the stores only trust runs in this environment.
    environment: marketplace
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download the .vsix from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "carbonwire-$GITHUB_REF_NAME.vsix"
      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath "carbonwire-$GITHUB_REF_NAME.vsix"
      # Turned on by the repository variable OPEN_VSX=true.
      - name: Publish to Open VSX
        if: vars.OPEN_VSX == 'true'
        run: npx --yes ovsx@1.3.0 publish "carbonwire-$GITHUB_REF_NAME.vsix" --trusted-publishing
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
